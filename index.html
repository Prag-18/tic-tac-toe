<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <h1 class="title">Tic Tac Toe</h1>

        <!-- Game Info -->
        <section class="info">
            <p><strong>Player 1:</strong> X</p>
            <p><strong>Player 2:</strong> O</p>
            <p class="status">Current Turn: X</p>
        </section>
        <div class="mode-select">
            <button id="twoPlayerBtn">2 Player Mode</button>
            <button id="aiModeBtn">AI Mode</button>
        </div>
        <div id="difficultyContainer" class="difficulty-select">
            <label for="difficulty">Difficulty:</label>
            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>



        <!-- Game Board -->
        <section class="game">
            <button class="box" data-index="0"></button>
            <button class="box" data-index="1"></button>
            <button class="box" data-index="2"></button>
            <button class="box" data-index="3"></button>
            <button class="box" data-index="4"></button>
            <button class="box" data-index="5"></button>
            <button class="box" data-index="6"></button>
            <button class="box" data-index="7"></button>
            <button class="box" data-index="8"></button>
        </section>

        <!-- Buttons -->
        <div class="controls">
            <button class="reset">Reset Game</button>
        </div>

        <!-- Winner Message Popup -->
        <div class="msg-container hide">
            <p id="msg">Winner</p>
            <button class="new-game">New Game</button>
        </div>
        <div id="confetti-container"></div>

    </main>

    <script src="script.js"></script>
</body>

</html>
